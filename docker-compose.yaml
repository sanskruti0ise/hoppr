version: "3.9"

services:
  weaviate:
    image: semitechnologies/weaviate:latest
    container_name: weaviate
    ports:
      - "8080:8080"
    environment:
      QUERY_DEFAULTS_LIMIT: 20
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
    restart: unless-stopped

  hoppr-backend:
    build: .
    container_name: hoppr-backend
    ports:
      - "8000:8000"
    environment:
      WEAVIATE_URL: "http://weaviate:8080"
    env_file:
      - .env                          # 👈 Load API keys and other secrets from .env
    depends_on:
      - weaviate
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    runtime: nvidia                   # 👈 Enable GPU runtime
